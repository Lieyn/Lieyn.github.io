baseURL = "https://lieyn.github.io/"
locale = "en-us"
title = "Quan Tran"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = true
buildExpired = false

pygmentsUseClasses = true

# Required for PaperMod's fuzzy search page
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Notes on decision-making under uncertainty — chess, research, and applied math."
  keywords = ["decision theory", "chess", "applied mathematics", "behavioral economics", "optimal stopping"]
  author = "Quan Tran"
  DateFormat = "January 2, 2006"

  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false
  hideSummary = false
  disableScrollToTop = false
  comments = false
  showtoc = true

  # Lil'Log model: full chronological stream on the homepage
  [params.homeInfoParams]
    Title = "Quan Tran"
    Content = """
I'm a high school student working through how people make decisions under uncertainty — in chess, in research, and in teaching.

Mostly I write up things I've actually built or proved. Posts lean quantitative; code and data are linked where they exist.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Lieyn"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    disableHLJS = false
    favicon = "/favicon.ico"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
[taxonomies]
  tag = "tags"
  category = "categories"
